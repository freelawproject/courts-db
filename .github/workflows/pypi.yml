name: PyPI
on:
  push:
    tags:
      - v*.*.*
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
            enable-cache: true
            version: "0.7.x"

      - name: Build
        run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
